<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proving Ground V2</title>
    <!-- HTMX -->
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <!-- TailwindCSS for quick styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        usmf: {
                            dark: '#0f172a',
                            light: '#e2e8f0',
                            accent: '#3b82f6',
                            danger: '#ef4444',
                            success: '#22c55e',
                            warning: '#eab308'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #0f172a;
            /* usmf-dark */
            color: #e2e8f0;
            /* usmf-light */
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>

<body class="h-screen flex flex-col">
    <nav class="bg-gray-800 p-4 border-b border-gray-700">
        <div class="container mx-auto flex justify-between items-center">
            <a href="/" class="text-2xl font-bold text-blue-500 tracking-tighter">USMF <span class="text-white">PROVING
                    GROUND</span></a>
            <div class="space-x-4">
                <a href="/asset-designer" class="hover:text-blue-400 transition">Asset Designer</a>
                <a href="/unit-designer" class="hover:text-blue-400 transition">Unit Designer</a>
                <a href="/scenarios" class="hover:text-blue-400 transition">Scenarios</a>
            </div>
        </div>
    </nav>

    <main class="flex-grow container mx-auto p-4" id="main-content">
        {% block content %}
        <div class="text-center mt-20">
            <h1 class="text-4xl font-bold mb-4">Welcome to the Proving Ground</h1>
            <p class="text-xl text-gray-400">Select a designer above to begin.</p>
        </div>
        {% endblock %}
    </main>

    <footer class="bg-gray-800 p-2 text-center text-xs text-gray-500">
        USMF Proving Ground V2 | System Ready
    </footer>
</body>

</html>
