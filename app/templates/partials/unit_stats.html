<h3 class="text-lg font-bold mb-2 text-blue-400">Logistics Overview</h3>
<div class="grid grid-cols-2 gap-4">
    <div class="bg-gray-700 p-2 rounded text-center">
        <div class="text-xs text-gray-400">Total Supply Draw</div>
        <div class="text-xl font-bold {% if stats.supply > 1000 %}text-red-500{% else %}text-green-500{% endif %}">
            {{ stats.supply }} / day
        </div>
    </div>
    <div class="bg-gray-700 p-2 rounded text-center">
        <div class="text-xs text-gray-400">Total Personnel</div>
        <div class="text-xl font-bold text-white">
            {{ stats.personnel }}
        </div>
    </div>
    <div class="bg-gray-700 p-2 rounded text-center">
        <div class="text-xs text-gray-400">Total Weight</div>
        <div class="text-xl font-bold text-gray-300">
            {{ stats.weight }}
        </div>
    </div>
    <div class="bg-gray-700 p-2 rounded text-center">
        <div class="text-xs text-gray-400">Est. Cost</div>
        <div class="text-xl font-bold text-yellow-500">
            ${{ stats.cost }}
        </div>
    </div>
</div>
