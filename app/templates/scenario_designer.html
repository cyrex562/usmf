{% extends "base.html" %}

{% block content %}
<div class="container mx-auto p-4">
    <h1 class="text-3xl font-bold text-white mb-6">Scenario Designer</h1>

    <form id="scenario-form" class="bg-gray-800 rounded-lg p-6 border border-gray-700">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
            <div>
                <label class="block text-gray-400 mb-2">Scenario Name</label>
                <input type="text" name="name" required
                    class="w-full bg-gray-700 text-white px-3 py-2 rounded border border-gray-600">
            </div>

            <div>
                <label class="block text-gray-400 mb-2">Duration (hours)</label>
                <input type="number" name="duration_hours" value="24" min="1"
                    class="w-full bg-gray-700 text-white px-3 py-2 rounded border border-gray-600">
            </div>

            <div>
                <label class="block text-gray-400 mb-2">Terrain Type</label>
                <select name="terrain_type" required
                    class="w-full bg-gray-700 text-white px-3 py-2 rounded border border-gray-600">
                    {% for terrain in terrain_types %}
                    <option value="{{ terrain }}">{{ terrain }}</option>
                    {% endfor %}
                </select>
            </div>

            <div>
                <label class="block text-gray-400 mb-2">Weather</label>
                <select name="weather" class="w-full bg-gray-700 text-white px-3 py-2 rounded border border-gray-600">
                    {% for weather in weather_options %}
                    <option value="{{ weather }}">{{ weather }}</option>
                    {% endfor %}
                </select>
            </div>
        </div>

        <div class="mb-6">
            <label class="block text-gray-400 mb-2">Description</label>
            <textarea name="description" rows="3" required
                class="w-full bg-gray-700 text-white px-3 py-2 rounded border border-gray-600"></textarea>
        </div>

        <h3 class="text-xl font-bold text-white mb-4">Forces</h3>
        <div id="forces-container" class="space-y-4 mb-6">
            <!-- Force entries will be added here -->
        </div>

        <button type="button" onclick="addForce()"
            class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded mb-4">
            + Add Force
        </button>

        <div class="flex gap-4">
            <button type="submit" class="bg-green-600 hover:bg-green-700 text-white px-6 py-2 rounded">
                Create Scenario
            </button>
            <a href="/scenarios" class="bg-gray-600 hover:bg-gray-700 text-white px-6 py-2 rounded inline-block">
                Cancel
            </a>
        </div>
    </form>
</div>

<script>
    let forceCount = 0;
    const rootUnits = {{ root_units | tojson }};

    function addForce() {
        const container = document.getElementById('forces-container');
        const forceDiv = document.createElement('div');
        forceDiv.className = 'bg-gray-700 p-4 rounded border border-gray-600';
        forceDiv.innerHTML = `
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
            <div>
                <label class="block text-gray-400 mb-2">Side Name</label>
                <input type="text" name="forces[${forceCount}][side_name]" 
                    placeholder="e.g., Blue Force" required
                    class="w-full bg-gray-600 text-white px-3 py-2 rounded">
            </div>
            <div>
                <label class="block text-gray-400 mb-2">Root Unit</label>
                <select name="forces[${forceCount}][root_unit_id]" required
                    class="w-full bg-gray-600 text-white px-3 py-2 rounded">
                    <option value="">Select Unit...</option>
                    ${rootUnits.map(u => `<option value="${u.id}">${u.name}</option>`).join('')}
                </select>
            </div>
            <div>
                <label class="block text-gray-400 mb-2">Starting Supply</label>
                <input type="number" name="forces[${forceCount}][starting_supply]" 
                    value="1000" min="0"
                    class="w-full bg-gray-600 text-white px-3 py-2 rounded">
            </div>
        </div>
        <button type="button" onclick="this.parentElement.remove()" 
            class="mt-2 text-red-400 hover:text-red-300 text-sm">
            Remove Force
        </button>
    `;
        container.appendChild(forceDiv);
        forceCount++;
    }

    // Add initial force
    addForce();

    document.getElementById('scenario-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const formData = new FormData(e.target);

        // Build scenario object
        const scenario = {
            name: formData.get('name'),
            description: formData.get('description'),
            terrain_type: formData.get('terrain_type'),
            weather: formData.get('weather'),
            duration_hours: parseInt(formData.get('duration_hours')),
            forces: []
        };

        // Extract forces
        for (let i = 0; i < forceCount; i++) {
            const sideName = formData.get(`forces[${i}][side_name]`);
            if (sideName) {
                scenario.forces.push({
                    side_name: sideName,
                    root_unit_id: parseInt(formData.get(`forces[${i}][root_unit_id]`)),
                    starting_supply: parseInt(formData.get(`forces[${i}][starting_supply]`))
                });
            }
        }

        // Submit
        const response = await fetch('/api/scenarios', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(scenario)
        });

        if (response.ok) {
            window.location.href = '/scenarios';
        } else {
            alert('Error creating scenario');
        }
    });
</script>
{% endblock %}
