[workspace]
resolver = "2"
members = [
    "crates/usmf-core",
    "crates/usmf-db",
    "crates/usmf-sim",
    "crates/usmf-api",
]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
usmf-core = { path = "crates/usmf-core" }
usmf-db = { path = "crates/usmf-db" }
usmf-sim = { path = "crates/usmf-sim" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rand = "0.8"
rand_chacha = "0.3"
